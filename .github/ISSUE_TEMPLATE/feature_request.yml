name: Feature request
description: Suggest an improvement to the CLI, the frontends, the docs, or the tooling
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or the friction — what is hard, confusing, or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of the project would this touch?
      options:
        - Core CLI (ocgo)
        - GNOME Shell extension
        - Cinnamon applet
        - Docs
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you prefer the proposal.
